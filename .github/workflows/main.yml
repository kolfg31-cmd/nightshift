name: Build Unsigned IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and Sync Capacitor
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r NightShift.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NightShift-IPA
          path: ios/App/NightShift.ipa



